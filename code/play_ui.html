<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play the Agent</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.brown.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.cburnett.css">
<style>
  :root { --bg: #f4f2ee; --panel: #fff; --text: #222; --muted: #777; --accent: #2f6fb3; --border: #ddd; --clock-on: #2e7d32; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --panel: #2a2a2d; --text: #eee; --muted: #999; --accent: #6aa5e8; --border: #444; --clock-on: #4caf50; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 24px 16px; }
  #board { width: min(92vw, 600px); aspect-ratio: 1; }
  .side { width: min(92vw, 320px); display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .clock { font: 600 30px/1 ui-monospace, monospace; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
  .clock .who { font: 14px system-ui, sans-serif; color: var(--muted); }
  .clock.running { border-color: var(--clock-on); box-shadow: inset 4px 0 0 var(--clock-on); }
  .clock.low .time { color: #d32f2f; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; }
  select, input { font: inherit; padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); max-width: 170px; }
  input[type=number] { width: 80px; }
  button { font: inherit; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 8px; }
  #status { font-weight: 600; min-height: 1.4em; }
  #info { color: var(--muted); font-size: 13px; min-height: 1.2em; }
  #moves { font: 13px/1.6 ui-monospace, monospace; max-height: 180px; overflow-y: auto; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div id="board"></div>
  <div class="side">
    <div class="panel clock" id="clock-top"><span class="who"></span><span class="time"></span></div>
    <div class="panel">
      <div id="status">Set up a game</div>
      <div id="info"></div>
    </div>
    <div class="panel clock" id="clock-bottom"><span class="who"></span><span class="time"></span></div>
    <div class="panel">
      <label>Opponent
        <select id="opponent">
          <option value="agent">Agent (search)</option>
          <option value="policy">Agent (raw policy)</option>
          <option value="stockfish">Stockfish</option>
        </select>
      </label>
      <label id="row-ckpt">Checkpoint <select id="ckpt"></select></label>
      <label id="row-sims">Simulations <input id="sims" type="number" min="1" step="1"></label>
      <label id="row-elo">Stockfish Elo <input id="elo" type="number" min="1320" max="3190" step="50"></label>
      <label>You play
        <select id="color">
          <option value="white">White</option>
          <option value="black">Black</option>
          <option value="random">Random</option>
        </select>
      </label>
      <label>Minutes <input id="minutes" type="number" min="0.25" step="0.25"></label>
      <label>Increment (s) <input id="increment" type="number" min="0" step="1"></label>
      <label>Promote to
        <select id="promo">
          <option value="q">Queen</option><option value="r">Rook</option>
          <option value="b">Bishop</option><option value="n">Knight</option>
        </select>
      </label>
      <div class="row">
        <button class="primary" id="new">New game</button>
        <button id="resign">Resign</button>
      </div>
    </div>
    <div class="panel" id="moves"></div>
  </div>
</main>

<script type="module">
import { Chessground } from "https://cdn.jsdelivr.net/npm/chessground@9.1.1/+esm";
import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm";

const $ = id => document.getElementById(id);
const COLOR = { w: "white", b: "black" };

let chess = new Chess();
let game = null;       // {id, user, opp, timeMs: {w, b}, incMs, over, turnStart, settings}
let gameCounter = 0;
let ticker = null;

const cg = Chessground($("board"), {
  movable: { free: false, color: undefined, showDests: true, events: { after: onUserMove } },
  premovable: { enabled: true },
  highlight: { lastMove: true, check: true },
  animation: { duration: 150 },
});

function dests() {
  const d = new Map();
  for (const m of chess.moves({ verbose: true })) {
    if (!d.has(m.from)) d.set(m.from, []);
    d.get(m.from).push(m.to);
  }
  return d;
}

function syncBoard(lastMove) {
  const userTurn = game && !game.over && chess.turn() === game.user;
  cg.set({
    fen: chess.fen(),
    turnColor: COLOR[chess.turn()],
    check: chess.inCheck(),
    lastMove,
    movable: { color: game && !game.over ? COLOR[game.user] : undefined, dests: userTurn ? dests() : new Map() },
  });
  const hist = chess.history();
  let txt = "";
  for (let i = 0; i < hist.length; i += 2) txt += `${i / 2 + 1}. ${hist[i]} ${hist[i + 1] ?? ""}\n`;
  $("moves").textContent = txt;
  $("moves").scrollTop = $("moves").scrollHeight;
}

function fmt(ms) {
  ms = Math.max(0, ms);
  const s = ms / 1000;
  if (s < 10) return `0:0${s.toFixed(1)}`;
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return `${m}:${String(r).padStart(2, "0")}`;
}

function remaining(side) {
  let t = game.timeMs[side];
  if (!game.over && chess.turn() === side) t -= performance.now() - game.turnStart;
  return t;
}

function renderClocks() {
  if (!game) return;
  const bottom = game.user, top = game.user === "w" ? "b" : "w";
  for (const [el, side] of [[$("clock-top"), top], [$("clock-bottom"), bottom]]) {
    const t = remaining(side);
    el.querySelector(".time").textContent = fmt(t);
    el.querySelector(".who").textContent = (side === game.user ? "You" : game.oppName) + ` (${COLOR[side]})`;
    el.classList.toggle("running", !game.over && chess.turn() === side);
    el.classList.toggle("low", t < 10000);
  }
  const side = chess.turn();
  if (!game.over && remaining(side) <= 0) {
    game.timeMs[side] = 0;
    endGame(side === game.user ? `You lost on time` : `${game.oppName} lost on time`);
  }
}

function endGame(msg) {
  game.over = true;
  $("status").textContent = msg;
  clearInterval(ticker);
  renderClocks();
  syncBoard(cg.state.lastMove);
}

function checkGameOver() {
  if (!chess.isGameOver()) return false;
  let msg;
  if (chess.isCheckmate()) msg = chess.turn() === game.user ? `Checkmate, ${game.oppName} wins` : "Checkmate, you win";
  else if (chess.isStalemate()) msg = "Draw by stalemate";
  else if (chess.isThreefoldRepetition()) msg = "Draw by threefold repetition";
  else if (chess.isInsufficientMaterial()) msg = "Draw by insufficient material";
  else msg = "Draw (50-move rule)";
  endGame(msg);
  return true;
}

// Makes the move and presses the mover's clock (adding the increment).
// Returns false if the mover's flag had already fallen.
function applyMove(from, to, promotion) {
  const side = chess.turn(), left = remaining(side);
  if (left <= 0) { renderClocks(); return false; }
  const mv = chess.move({ from, to, promotion });  // throws if illegal
  game.timeMs[side] = left + game.incMs;
  game.turnStart = performance.now();
  syncBoard([mv.from, mv.to]);
  return true;
}

function onUserMove(from, to) {
  if (!game || game.over) return;
  const needsPromo = chess.moves({ verbose: true }).some(m => m.from === from && m.to === to && m.promotion);
  let ok;
  try {
    ok = applyMove(from, to, needsPromo ? $("promo").value : undefined);
  } catch {
    syncBoard();
    return;
  }
  if (ok && !checkGameOver()) requestOpponentMove();
}

async function requestOpponentMove() {
  const id = game.id;
  $("status").textContent = `${game.oppName} is thinking...`;
  const moves = chess.history({ verbose: true }).map(m => m.from + m.to + (m.promotion ?? ""));
  let data;
  try {
    const res = await fetch("/api/move", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ moves, ...game.settings }),
    });
    data = await res.json();
    if (!res.ok) throw new Error(data.error);
  } catch (e) {
    if (game.id === id && !game.over) endGame(`Server error: ${e.message}`);
    return;
  }
  if (game.id !== id || game.over) return;  // stale reply (new game or flag)
  const u = data.move;
  if (!applyMove(u.slice(0, 2), u.slice(2, 4), u[4])) return;
  let info = `${game.oppName} took ${data.seconds.toFixed(2)}s`;
  if (data.wdl) {
    const [w, d, l] = data.wdl.map(x => Math.round(100 * x));
    info += ` · its network eval: win ${w}% draw ${d}% loss ${l}%`;
  }
  $("info").textContent = info;
  if (!checkGameOver()) {
    $("status").textContent = "Your move";
    cg.playPremove();
  }
}

function newGame() {
  clearInterval(ticker);
  chess = new Chess();
  let user = $("color").value;
  if (user === "random") user = Math.random() < 0.5 ? "white" : "black";
  user = user[0];
  const opponent = $("opponent").value;
  const settings = { opponent, ckpt: $("ckpt").value, sims: +$("sims").value, elo: +$("elo").value };
  const oppName = opponent === "stockfish" ? `Stockfish ${settings.elo}`
    : opponent === "policy" ? "Policy" : `Agent ${settings.sims} sims`;
  if (opponent !== "stockfish" && !settings.ckpt) { $("status").textContent = "No checkpoint found under runs/"; return; }
  const ms = +$("minutes").value * 60000;
  game = { id: ++gameCounter, user, oppName, settings, timeMs: { w: ms, b: ms },
           incMs: +$("increment").value * 1000, over: false, turnStart: performance.now() };
  cg.set({ orientation: COLOR[user] });
  cg.cancelPremove();
  $("info").textContent = "";
  syncBoard();
  ticker = setInterval(renderClocks, 100);
  renderClocks();
  if (user === "w") $("status").textContent = "Your move";
  else requestOpponentMove();
}

function updateRows() {
  const o = $("opponent").value;
  $("row-ckpt").classList.toggle("hidden", o === "stockfish");
  $("row-sims").classList.toggle("hidden", o !== "agent");
  $("row-elo").classList.toggle("hidden", o !== "stockfish");
}

$("opponent").onchange = updateRows;
$("new").onclick = newGame;
$("resign").onclick = () => { if (game && !game.over) endGame("You resigned"); };

const opts = await (await fetch("/api/options")).json();
for (const c of opts.checkpoints) $("ckpt").add(new Option(c, c));
const preferred = ["main/latest.pt", "main/warmstart.pt"].find(c => opts.checkpoints.includes(c));
if (preferred) $("ckpt").value = preferred;
$("sims").value = opts.sims;
$("minutes").value = opts.minutes;
$("increment").value = opts.increment;
$("elo").value = opts.stockfish_elo;
updateRows();
</script>
</body>
</html>
